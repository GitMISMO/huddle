<!doctype html>
<!--
  Huddle: the page people open to mark which times work. resources.mismo.org/huddle/poll.html
    #p=<poll>&k=<code>             the shared link the organizer sends to everyone
    #p=<poll>&i=<invitee>.<code>   a personal link (name and email already filled in)
    #p=<poll>&v=<voter>.<code>     the link handed back after answering, to change answers later
  No sign-in. The codes live after the # so they are never sent to a server in the address, never appear in logs,
  and are not passed on as a referrer. The page talks to two relay routes that need no sign-in
  (POST /huddle/group-poll/view and /answer). The relay checks the code and hands back only what someone
  answering needs: never an email address, and in a hidden poll no one else's name or answers.
  Opened anywhere other than resources.mismo.org (or with ?preview=1): a preview with made-up times.
  Storage key: tools:huddle:me:<poll> (this person's own edit link, so the shared link remembers them).
-->
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>Pick Times | MISMO</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
:root{
  --navy:#0d314c; --sky:#74bfeb; --navy-deep:#06202f; --navy-mid:#14486e; --sky-soft:#a9d8f3; --sky-wash:#e4f2fb;
  --ground:#f1f6fa; --surface:#ffffff; --surface-2:#f6fafd; --surface-3:#e9f1f8;
  --border:#d5e2ed; --border-strong:#adc4d6; --rule:#e5eef5;
  --ink:#0d314c; --ink-2:#456179; --ink-3:#7794aa;
  --good:#0f7b5c; --bad:#b3372c; --warn:#a2701a; --good-soft:#e2f3ec; --bad-soft:#fbe9e7; --warn-soft:#fbf1dc;

  --good:#4fc79b; --bad:#f08579; --warn:#e0a83c; --good-soft:#123a30; --bad-soft:#3d1f1d; --warn-soft:#3a2e14; --sky-wash:#102f41;
  --free:#16463a; --some:#4a3b17; --busy:#4b2422; --unk:#173547;
  --btn:#74bfeb; --btn-ink:#06202f; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
  --border:#1f4a63; --border-strong:#2f6688; --rule:#173547;
  --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;

}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.masthead{background:var(--navy);color:#fff}
.masthead-in{display:flex;align-items:center;gap:14px;padding:11px 20px;max-width:1080px;margin:0 auto}
.logoplate{background:#fff;border-radius:5px;padding:9px 13px;display:flex;align-items:center;line-height:0;flex:none}
.logoplate .wordmark{height:22px;width:auto}
.vrule{width:2px;align-self:stretch;background:var(--sky);border-radius:1px}
.pagename{color:var(--sky);font-weight:700;font-size:15px;white-space:nowrap}
@media(max-width:420px){.logoplate{padding:7px 10px}.logoplate .wordmark{height:18px}.masthead-in{gap:10px;padding:10px 14px}}
.theme{margin-left:auto;appearance:none;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:5px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.theme:hover{background:rgba(255,255,255,.1)}
main{max-width:1080px;margin:0 auto;padding:26px 20px 90px}
h1{font-size:26px;letter-spacing:-.012em;margin:0 0 4px;text-wrap:balance}
.by{color:var(--ink-2);margin:0}
.about{margin:10px 0 0;color:var(--ink);white-space:pre-line}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fact{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:4px 10px;font-size:13.5px;color:var(--ink-2)}
.fact svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-top:20px}
.card-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.card h2{font-size:17px;margin:0}
.card-h .r{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
select,textarea,input[type=text],input[type=email]{border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:8px 10px;min-height:40px;width:100%}
select{width:auto;min-height:34px;padding:4px 8px}
textarea{min-height:80px;resize:vertical}
select:focus,textarea:focus,input:focus{outline:2px solid var(--sky);border-color:var(--sky)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.who label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
@media(max-width:560px){.who{grid-template-columns:1fr}}
.help{color:var(--ink-2);margin:4px 0 4px;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin:6px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-flex;width:24px;height:20px;border-radius:4px;align-items:center;justify-content:center}
.mk{width:20px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.legend .mk{width:14px;height:13px}
.c-y{background:var(--free);color:var(--good)} .c-m{background:var(--some);color:var(--warn)} .c-n{background:var(--busy);color:var(--bad)} .c-0{background:var(--unk);color:var(--ink-3)}
.day{margin-top:16px}
.day h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:0 0 4px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 14px;padding:10px 0;border-top:1px solid var(--rule)}
.opt .t{font-weight:600;font-size:15.5px}
.opt .cnt{font-size:13px;color:var(--ink-2);display:block;font-weight:400}
.opt .cnt b{color:var(--good)}
.opt.full .t{color:var(--ink-3)}
.opt.best .t::after{content:'Most popular';display:inline-block;margin-left:8px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--good-soft);color:var(--good);border-radius:3px;padding:1px 6px;vertical-align:2px}
.tri{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden}
.tri button{appearance:none;border:0;border-right:1px solid var(--border);background:var(--surface);padding:8px 15px;cursor:pointer;min-width:56px;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1;font-size:13px;font-weight:600}
.tri button:last-child{border-right:0}
.tri button.y{color:var(--good)} .tri button.m{color:var(--warn)} .tri button.n{color:var(--bad)}
.tri button[aria-pressed="true"]{color:#fff}
:root[data-theme="dark"] .tri button[aria-pressed="true"]{color:#06202f}

.tri button[aria-pressed="true"].y{background:var(--good)} .tri button[aria-pressed="true"].m{background:var(--warn)} .tri button[aria-pressed="true"].n{background:var(--bad)}
.tri button:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.tri button span{white-space:nowrap}
.tri button .mk{display:block;flex:none}
.fulltag{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--border);border-radius:4px;padding:4px 10px}

.gridwrap{overflow:auto;border:1px solid var(--border);border-radius:8px;margin-top:10px}
table.g{border-collapse:separate;border-spacing:0;min-width:100%;font-size:13px}
table.g th,table.g td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);padding:6px 7px;text-align:center;white-space:nowrap}
table.g th:first-child,table.g td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px;font-weight:600}
table.g thead th{background:var(--surface-2);font-weight:600;font-size:12px;vertical-align:bottom}
table.g thead th .d{display:block;color:var(--ink-3);font-weight:500}
table.g td .cl{display:flex;align-items:center;justify-content:center;height:28px;border-radius:4px;min-width:70px}
table.g tr.me td{background:var(--sky-wash)}
table.g tr.me td:first-child{background:var(--sky-wash)}
table.g tfoot td{background:var(--surface-2);font-weight:600}
.btn{appearance:none;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:7px;padding:11px 22px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;min-width:max-content}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--border-strong);padding:6px 12px;font-size:13px}
.note{padding:14px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);margin-top:18px}
.note.ok{border-color:var(--good);background:var(--good-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note .big{display:block;font-size:20px;font-weight:700;margin:4px 0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.sendrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:16px}
.foot{margin-top:24px;color:var(--ink-3);font-size:13px}
.preview{background:var(--warn-soft);border:1px solid var(--warn);border-radius:6px;padding:7px 12px;font-size:13px;margin-bottom:16px}
</style>
</head>
<body>
__LOGO__
<header class="masthead"><div class="masthead-in">

  <button class="theme" id="theme" type="button">Dark Mode</button>
</div></header>
<main>
  <div id="pv" class="preview" hidden><b>Preview.</b> Made-up times; nothing you send here is saved.</div>
  <div id="state" role="status" aria-live="polite"><p class="muted">Loading the poll…</p></div>
  <div id="wrap" hidden>
    <h1 id="title"></h1>
    <p class="by" id="by"></p>
    <p class="about" id="about" hidden></p>
    <div class="facts" id="facts"></div>
    <div id="after"></div>
    <form id="form" novalidate>
      <section class="card">
        <div class="card-h"><h2>Your Name</h2></div>
        <div class="who">
          <label><span>Name</span><input type="text" id="name" maxlength="80" autocomplete="name"></label>
          <label id="emailwrap"><span>Email <span id="emailreq" class="muted"></span></span><input type="email" id="email" maxlength="200" autocomplete="email"></label>
        </div>
      </section>
      <section class="card">
        <div class="card-h"><h2>Which Times Work for You?</h2><span class="r"><span>Show times in</span><select id="tz" aria-label="Time zone"></select></span></div>
        <p class="help" id="howto"></p>
        <div class="legend" id="legend"></div>
        <div id="opts"></div>
      </section>
      <section class="card" id="peoplecard" hidden>
        <div class="card-h"><h2>Everyone’s Answers</h2><span class="r" id="peoplecount"></span></div>
        <div class="gridwrap"><table class="g" id="grid"></table></div>
      </section>
      <section class="card" id="commentcard">
        <label for="comment"><h2 style="display:inline;font-size:17px">Comment</h2> <span class="muted small">(optional)</span></label>
        <textarea id="comment" maxlength="1000" placeholder="Anything the organizer should know" style="margin-top:8px"></textarea>
      </section>
      <div class="hp" aria-hidden="true"><label>Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>
      <div class="sendrow">
        <button class="btn" type="submit" id="send">Send My Answers</button>
        <span id="say" class="small" role="status" aria-live="polite"></span>
      </div>
      <p class="foot" id="foot">You can come back to this link to change your answers while the poll is open.</p>
    </form>
  </div>
</main>

    });
  }
  function paintGrid() {
    if (D.settings.hidden || !D.people.length) { $('peoplecard').hidden = true; return; }

    t += '</tbody><tfoot><tr><td>Yes</td>' + os.map(function (o) { return '<td>' + c[o.id].y + (c[o.id].m ? ' <span class="muted">(' + c[o.id].m + ')</span>' : '') + '</td>'; }).join('') + '</tr></tfoot>';

  function facts() {
    var f = [];

    if (D.duration) f.push('<span class="fact">' + I_.clock + D.duration + ' minutes</span>');

    $('facts').innerHTML = f.join('');
  }
  function show(d) {
    D = d; note('', '');
    $('title').textContent = d.title; document.title = d.title + ' | MISMO';
    $('by').textContent = (d.organizer ? d.organizer + ' is finding a time' : 'Finding a time') + (d.count ? ' · ' + d.count + (d.count === 1 ? ' person has' : ' people have') + ' answered' : '');

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var say = $('say'); say.style.color = 'var(--bad)';
    var name = $('name').value.trim(), email = $('email').value.trim();

    var picked = Object.keys(ans).filter(function (k) { return ans[k]; });

    /* anything left unmarked counts as no, as Doodle does */
    var out = {}; D.options.forEach(function (o) { if (D.full.indexOf(o.id) < 0 || ans[o.id]) out[o.id] = ans[o.id] || 'n'; });
    var body = { p: P, name: name, email: D.settings.askEmail === 'off' ? '' : email, answers: out, comment: D.settings.comments ? $('comment').value.trim() : '', startedAt: started, website: $('website').value };
    if (V) body.v = V; if (I) body.i = I; if (K) body.k = K;
    $('send').disabled = true; say.style.color = ''; say.textContent = 'Sending…';
    call('answer', body).then(function (r) {
      if (r && r.v) { V = r.v; try { localStorage.setItem(MEKEY, V); } catch (e2) {} }
      var editLink = location.origin + location.pathname + '#p=' + P + (V ? '&v=' + V : (K ? '&k=' + K : '&i=' + I));
      $('form').hidden = true; $('after').innerHTML = '';
      var y = Object.keys(out).filter(function (k) { return out[k] === 'y'; }).length;
      note('ok', '<b>Thank you, ' + esc(name.split(/\s+/)[0]) + '. Your answers are in.</b> ' + (y ? y + (y === 1 ? ' time works' : ' times work') + ' for you. ' : '') +
        esc(D.organizer || 'The organizer') + ' will send a calendar invitation once a time is picked.' +
        '<div class="sendrow"><button class="btn ghost" type="button" id="again">Change My Answers</button><button class="btn ghost" type="button" id="cplink">Copy My Link</button></div>' +
        '<p class="small muted" style="margin:10px 0 0">Keep your link to change your answers later. This browser remembers it too.</p>' + (PREVIEW ? '<p class="small"><b>Preview:</b> nothing was saved.</p>' : ''));
      $('again').onclick = function () { $('state').innerHTML = ''; load(0); };
      $('cplink').onclick = function () { var b = this; (navigator.clipboard ? navigator.clipboard.writeText(editLink) : Promise.reject()).then(function () { b.textContent = 'Copied'; }, function () { prompt('Copy your link:', editLink); }); };
      window.scrollTo(0, 0);
    }, function (err) {
      $('send').disabled = false; say.style.color = 'var(--bad)';
      if (err.code === 'FULL') { (err.body.options || []).forEach(function (id) { if (D.full.indexOf(id) < 0) D.full.push(id); delete ans[id]; }); paintOpts(); paintGrid(); }
      say.textContent = err.code === 'TOO_MANY' ? 'Several answers were just sent from here. Please try again in a few minutes.' :
        err.code === 'CLOSED' ? 'This poll has just closed, so answers aren’t being taken.' :
        err.code === 'FULL' ? 'Someone just took the last place at a time you picked. It’s marked Full now; pick another.' :
        err.code === 'INVALID' ? ((err.body && err.body.problems || []).join(' ') || 'Please check your answers.') :
        err.code === 'OFFLINE' ? 'Couldn’t connect. Press Send again; if it still won’t go, your network may be blocking it, so reply to the organizer’s email with the times that work.' :
        'Your answers couldn’t be saved just now. Please try again in a minute.';
    });
  });
  if (!P || !(K || I || V)) { note('bad', '<b>This link isn’t complete.</b> Open it straight from the email or message you received.'); return; }
  if (PREVIEW) $('pv').hidden = false;
  var BLOCKED = '<b>This page couldn’t reach MISMO’s poll service from your network.</b> Some company networks block it. Reply to the organizer’s email with the days and times that work for you, or open the link on your phone using mobile data instead of the office Wi-Fi.';
  function load(n) {
    var body = { p: P }; if (V) body.v = V; if (I) body.i = I; if (K) body.k = K;
    call('view', body).then(function (d) { $('form').hidden = false; show(d); }, function (err) {
      if ((err.code === 'OFFLINE' || err.status >= 500) && n < 2) { note('', '<p class="muted">Loading the poll…</p>'); setTimeout(function () { load(n + 1); }, n ? 5000 : 2000); return; }
      /* a remembered link that no longer works (taken off by the organizer): forget it and use the shared link */
      if ((err.code === 'NOT_FOUND' || err.status === 404) && V && (K || I) && !/[&]v=/.test('&' + h)) { try { localStorage.removeItem(MEKEY); } catch (e) {} V = ''; load(n); return; }
      if (err.code === 'NOT_FOUND' || err.status === 404) note('bad', '<b>This link doesn’t match a poll.</b> It may have been replaced or the poll put away. Check with the person who sent it.');
      else if (err.code === 'TOO_MANY') note('warn', 'Too many tries from here in a short time. Please wait a few minutes and reload.');
      else if (err.code === 'OFFLINE') note('bad', BLOCKED);
      else note('bad', 'The poll couldn’t be loaded just now. Please reload the page in a minute.');

  }
  load(0);
})();
